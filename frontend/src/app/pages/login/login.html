<div class="login-container">

  <div class="login-card">

    <h1>CogniFact AI</h1>

    <p class="subtitle">
      Welcome back
    </p>

    <form>

      <label>Email</label>
      <input
        type="email"
        placeholder="Enter your email"
      >

      <label>Password</label>
      <input
        type="password"
        placeholder="Enter your password"
      >

      <button type="submit">
        Login
      </button>

    </form>

    <p class="register-text">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>

  </div>

</div>
